[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (unused/undefined names) and syntax errors. Kept narrow on purpose:
# it catches real mistakes without reformatting the codebase.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported into test modules and then "redefined" as arguments.
"tests/*" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
