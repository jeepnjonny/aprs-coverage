# APRS Coverage nginx config for apps.k7swi.org with SSL
#
# Install:
#   sudo cp nginx-aprs-coverage.conf /etc/nginx/sites-available/aprs-coverage
#   sudo ln -sf /etc/nginx/sites-available/aprs-coverage /etc/nginx/sites-enabled/aprs-coverage
#
# Or run:  bash setup.sh --ssl   (gets the certificate and installs this file)

server {
    listen 80;
    listen [::]:80;
    server_name apps.k7swi.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apps.k7swi.org;

    ssl_certificate     /etc/letsencrypt/live/apps.k7swi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.k7swi.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Live packet feed (Server-Sent Events): no buffering, long timeouts
    location /api/live {
        proxy_pass         http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   Connection      "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types application/json application/javascript text/css;
    }
}
