# APRS Coverage: nginx location snippet for https://apps.k7swi.org/aprs-coverage/
#
# This is not a whole site. It goes inside the existing apps.k7swi.org
# server { listen 443 ssl; ... } block, next to the other apps:
#
#   sudo cp nginx-aprs-coverage.conf /etc/nginx/snippets/aprs-coverage.conf
#   # then add this line inside the apps.k7swi.org HTTPS server block:
#   #     include snippets/aprs-coverage.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# setup.sh and update.sh copy this file to /etc/nginx/snippets for you.
# Adding the include line is a one-time manual step.
#
# The trailing slash on proxy_pass strips /aprs-coverage/ before the request
# reaches the app, so the app itself does not know its prefix. The pages use
# relative URLs, and X-Forwarded-Prefix scopes the admin cookie to this path.

location = /aprs-coverage {
    return 301 /aprs-coverage/;
}

# Live packet feed (Server-Sent Events): no buffering, long timeouts
location /aprs-coverage/api/live {
    proxy_pass         http://127.0.0.1:8077/api/live;
    proxy_http_version 1.1;
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-Prefix /aprs-coverage;
    proxy_set_header   Connection         "";
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
}

location /aprs-coverage/ {
    proxy_pass         http://127.0.0.1:8077/;
    proxy_http_version 1.1;
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   X-Forwarded-Prefix /aprs-coverage;
    gzip on;
    gzip_types application/json application/javascript text/css;
}
